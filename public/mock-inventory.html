<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Inventory | Automated & Co WhatsApp POC</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --surface: #ffffff;
        --surface-soft: #f0f3f5;
        --text: #172026;
        --muted: #66737c;
        --border: #dce2e6;
        --available: #087f5b;
        --unavailable: #b42318;
        --accent: #1f5eff;
        --shadow: 0 16px 40px rgba(23, 32, 38, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 1;
        font-weight: 760;
        letter-spacing: 0;
      }

      .summary {
        margin-top: 12px;
        max-width: 640px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.55;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(86px, 1fr));
        gap: 10px;
        min-width: min(100%, 360px);
      }

      .stat {
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .stat strong {
        display: block;
        font-size: 1.45rem;
        line-height: 1;
      }

      .stat span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .inventory-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .product-card {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .product-visual {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 132px;
        background:
          linear-gradient(135deg, rgba(31, 94, 255, 0.14), rgba(8, 127, 91, 0.1)),
          var(--surface-soft);
        color: #23313a;
        font-size: 3.2rem;
        font-weight: 800;
      }

      .product-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 18px;
        padding: 20px;
      }

      .product-title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      h2 {
        font-size: 1.25rem;
        line-height: 1.2;
      }

      .product-id {
        padding-top: 4px;
        color: var(--muted);
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .notes {
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.45;
      }

      .variants {
        display: grid;
        gap: 8px;
      }

      .variant {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        background: var(--surface-soft);
        border: 1px solid transparent;
        border-radius: 8px;
      }

      .variant-name {
        font-size: 0.9rem;
        font-weight: 650;
      }

      .variant-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .quantity {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 750;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 750;
      }

      .status.available {
        background: rgba(8, 127, 91, 0.12);
        color: var(--available);
      }

      .status.unavailable {
        background: rgba(180, 35, 24, 0.12);
        color: var(--unavailable);
      }

      .product-link {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        margin-top: auto;
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
      }

      .product-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 860px) {
        header {
          align-items: stretch;
          flex-direction: column;
        }

        .inventory-grid {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (max-width: 520px) {
        main {
          width: min(100% - 20px, 1120px);
          padding: 24px 0;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .product-body {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Mock Inventory</h1>
          <p class="summary">
            Read-only demo dataset for the Automated & Co WhatsApp POC. These products power the
            current mocked grocery availability, substitution, and upsell responses.
          </p>
        </div>
        <section class="stats" aria-label="Inventory summary">
          <div class="stat">
            <strong id="product-count">0</strong>
            <span>products</span>
          </div>
          <div class="stat">
            <strong id="variant-count">0</strong>
            <span>variants</span>
          </div>
          <div class="stat">
            <strong id="available-count">0</strong>
            <span>available</span>
          </div>
        </section>
      </header>

      <section class="inventory-grid" id="inventory-grid" aria-label="Mock inventory products"></section>
    </main>

    <script>
      const inventory = [
        {
          id: "prod_diablitos_underwood",
          name: "Diablitos Underwood",
          productUrl: "https://elportalvenezolano.com/products/diablitos",
          deliveryNotes: "Snapshot copiado del catalogo publico. Disponibilidad real debe venir luego por API.",
          variants: [
            {
              id: "diablitos_54g_x24",
              label: "54g x 24 unidades",
              quantityAvailable: 8,
              advisory: "Upsell: caja 54g x 48 unidades"
            },
            {
              id: "diablitos_54g_x48",
              label: "54g x 48 unidades",
              quantityAvailable: 3
            },
            {
              id: "diablitos_115g_x12",
              label: "115g x 12 unidades",
              quantityAvailable: 4
            },
            {
              id: "diablitos_115g_x24",
              label: "115g x 24 unidades",
              quantityAvailable: 2
            }
          ]
        },
        {
          id: "prod_riko_malt",
          name: "Riko Malt 500Ml Venezuela",
          productUrl: "https://elportalvenezolano.com/products/riko-malt-500ml-venezuela",
          deliveryNotes: "Bebida venezolana. Snapshot copiado del catalogo publico.",
          variants: [
            {
              id: "riko_malt_500ml",
              label: "Botella 500ml",
              quantityAvailable: 10,
              advisory: "Upsell: pack x 3 unidades"
            },
            {
              id: "riko_malt_500ml_x3",
              label: "500ml x 3 unidades",
              quantityAvailable: 5
            }
          ]
        },
        {
          id: "prod_golden_manzanita",
          name: "Golden Manzanita lata 355 Ml Venezuela",
          productUrl: "https://elportalvenezolano.com/products/golden-manzanita-botella-350-ml-venezuela-copia",
          deliveryNotes: "Refresco en lata. Snapshot copiado del catalogo publico.",
          variants: [
            {
              id: "golden_355ml",
              label: "Lata 355ml",
              quantityAvailable: 12,
              advisory: "Upsell: pack x 6 unidades"
            },
            {
              id: "golden_355ml_x6",
              label: "Lata 355ml x 6 unidades",
              quantityAvailable: 4
            }
          ]
        },
        {
          id: "prod_canelitas",
          name: "Canelitas Marinela",
          productUrl: "https://elportalvenezolano.com/products/canelitas-marinela-galletas-venezolanas",
          deliveryNotes: "Galletas venezolanas. El pack x3 aparece no disponible en el snapshot publico.",
          variants: [
            {
              id: "canelitas_individual",
              label: "Paquete individual",
              quantityAvailable: 9,
              advisory: "Alternative: 3 individuales can replace 1 pack x3"
            },
            {
              id: "canelitas_x3",
              label: "Pack x 3 unidades",
              quantityAvailable: 0
            }
          ]
        },
        {
          id: "prod_sopa_maggi",
          name: "Sopa de Pollo con Fideos Maggi 62g Venezuela",
          productUrl: "https://elportalvenezolano.com/products/sopa-maggi-62gr-venezuela",
          deliveryNotes: "Producto liviano. Snapshot copiado del catalogo publico.",
          variants: [
            {
              id: "sopa_maggi_62g",
              label: "Sobre 62g",
              quantityAvailable: 15,
              advisory: "Upsell: pack x 3 unidades"
            },
            {
              id: "sopa_maggi_62g_x3",
              label: "62g x 3 unidades",
              quantityAvailable: 5
            }
          ]
        }
      ];

      const grid = document.querySelector("#inventory-grid");
      const productCount = document.querySelector("#product-count");
      const variantCount = document.querySelector("#variant-count");
      const availableCount = document.querySelector("#available-count");

      const variants = inventory.flatMap((product) => product.variants);
      productCount.textContent = String(inventory.length);
      variantCount.textContent = String(variants.length);
      availableCount.textContent = String(variants.filter((variant) => variant.quantityAvailable > 0).length);

      grid.innerHTML = inventory.map(renderProduct).join("");

      function renderProduct(product) {
        const initials = product.name
          .split(" ")
          .map((word) => word[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();

        return `
          <article class="product-card">
            <div class="product-visual" aria-hidden="true">${initials}</div>
            <div class="product-body">
              <div class="product-title-row">
                <h2>${product.name}</h2>
                <span class="product-id">${product.id}</span>
              </div>
              <p class="notes">${product.deliveryNotes}</p>
              <div class="variants">
                ${product.variants.map(renderVariant).join("")}
              </div>
              <a class="product-link" href="${product.productUrl}">${product.productUrl}</a>
            </div>
          </article>
        `;
      }

      function renderVariant(variant) {
        const label = variant.label ?? "Variante unica";
        const isAvailable = variant.quantityAvailable > 0;
        const statusClass = isAvailable ? "available" : "unavailable";
        const statusText = isAvailable ? "Available" : "Unavailable";

        return `
          <div class="variant">
            <span class="variant-name">${label}</span>
            <span class="variant-meta">
              <span class="quantity">Qty ${variant.quantityAvailable}</span>
              <span class="status ${statusClass}">${statusText}</span>
            </span>
            ${variant.advisory ? `<span class="notes">${variant.advisory}</span>` : ""}
          </div>
        `;
      }
    </script>
  </body>
</html>
